# Netlify: build the Vite multi-page app (index.html + explore.html + map.html)
# and publish dist.
[build]
  command = "npm run build"
  publish = "dist"

# Clean URLs: /explore serves the timeline page, /map serves the atlas page.
# The landing page is served at / by default. Status 200 keeps the URL in the
# address bar (rewrite, not redirect).
[[redirects]]
  from = "/explore"
  to = "/explore.html"
  status = 200

[[redirects]]
  from = "/map"
  to = "/map.html"
  status = 200

# Hashed Vite assets under /assets are safe to cache forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML entry points must always revalidate so new deploys take effect immediately.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
